name: Package Verified FFI XCFramework

on:
  # This workflow verifies and packages the frozen full five-architecture artifact already
  # committed on the selected branch. Source rebuilds use Scripts/build-ironwood-ffi-artifact.sh.
  workflow_dispatch:
    inputs:
      version:
        description: 'SDK version (e.g., 2.5.0)'
        required: true

permissions: {}

jobs:
  package-xcframework:
    runs-on: warp-macos-15-arm64-12x
    # The live sdk-release environment must be protected before this workflow is dispatched.
    environment: sdk-release
    permissions:
      contents: write # Required for creating draft releases
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Select Xcode version
        run: sudo xcode-select -s '/Applications/Xcode_16.0.app/Contents/Developer'

      - name: Install pinned Rust verification tools
        run: |
          rust_toolchain=$(sed -nE 's/^channel = "([^"]+)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$rust_toolchain" --profile minimal
          rustup component add --toolchain "$rust_toolchain" llvm-tools-preview

      - name: Verify frozen committed artifact
        run: |
          ./Scripts/verify-ironwood-ffi-artifact.sh
          expected=(ios-arm64 ios-arm64_x86_64-simulator macos-arm64_x86_64)
          for slice in "${expected[@]}"; do
            test -f "LocalPackages/libzcashlc.xcframework/${slice}/libzcashlc.framework/libzcashlc"
          done
          count=$(find LocalPackages/libzcashlc.xcframework \( -type f -o -type l \) -path '*/libzcashlc.framework/libzcashlc' | wc -l | tr -d ' ')
          test "$count" = "3"

      - name: Package and upload draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          products=BuildSupport/products
          archive=libzcashlc.xcframework.zip
          mkdir -p "$products"
          rm -f "$products/$archive"
          (cd LocalPackages && /usr/bin/zip -qry "../$products/$archive" libzcashlc.xcframework)
          checksum=$(shasum -a 256 "$products/$archive" | awk '{print $1}')
          download_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${VERSION}/${archive}"
          printf 'CHECKSUM=%s\nDOWNLOAD_URL=%s\nVERSION=%s\n' \
            "$checksum" "$download_url" "$VERSION" > "$products/release.env"
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; refusing to overwrite a frozen artifact." >&2
            exit 1
          fi
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$VERSION" "$products/$archive" \
            --repo "$GITHUB_REPOSITORY" --title "$VERSION" \
            --notes "Zcash Light Client SDK $VERSION verified frozen FFI" --draft "${prerelease[@]}"

      - name: Output Package.swift Update
        run: |
          source BuildSupport/products/release.env
          echo ""
          echo "========================================"
          echo "Update Package.swift with:"
          echo "========================================"
          echo ""
          echo "url: \"${DOWNLOAD_URL}\","
          echo "checksum: \"${CHECKSUM}\""
          echo ""
          echo "Then commit, tag ${VERSION}, and publish the draft release."
