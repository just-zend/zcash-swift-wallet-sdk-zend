name: Build and Run Offline Tests

on:
  pull_request:
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/*'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - 'LICENSE'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'responsible_disclosure.md'
      - 'SWIFTLINT.md'
      - 'docs/**'

jobs:
  build:
    permissions:
      contents: read

    runs-on: macos-26

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
      timeout-minutes: 1

    - name: Select Xcode version
      run: sudo xcode-select -s '/Applications/Xcode_26.6.app/Contents/Developer'

    # The migration engine is a private exact-revision dependency. Public SDK CI intentionally
    # consumes the reviewed, committed FFI artifact and never needs private-repository credentials.
    - name: Verify committed XCFramework
      run: ./Scripts/verify-ironwood-ffi-artifact.sh

    # Build the Swift package
    - name: Build ZcashLightClientKit Swift Package
      timeout-minutes: 15
      run: swift build -v

    # Run tests
    - name: Run OfflineTests suite
      timeout-minutes: 10
      run: swift test --filter OfflineTests
