name: Build and Run Offline Tests

on:
  pull_request:
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/*'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - 'LICENSE'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'responsible_disclosure.md'
      - 'SWIFTLINT.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read

    runs-on: warp-macos-15-arm64-12x

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
      timeout-minutes: 1

    - name: Select Xcode version
      run: sudo xcode-select -s '/Applications/Xcode_16.0.app/Contents/Developer'

    # Cache the arm64-only XCFramework used by this arm64 runner. hashFiles avoids
    # spawning one process per source file, which is especially expensive under CodeQL.
    - name: Cache FFI XCFramework
      id: cache-ffi
      uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
      with:
        path: LocalPackages/libzcashlc.xcframework
        key: ffi-xcframework-${{ runner.os }}-${{ runner.arch }}-xcode-16.0-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust/**/*.rs', 'rust/**/*.c', 'rust/**/*.h', 'BuildSupport/module.modulemap', 'BuildSupport/platform-Info.plist', 'Scripts/init-local-ffi.sh') }}

    # Only set up Rust if we need to build FFI
    - name: Setup Rust
      if: steps.cache-ffi.outputs.cache-hit != 'true'
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
      with:
        toolchain: stable
        targets: aarch64-apple-darwin

    # Cache Cargo dependencies (only if building FFI)
    - name: Cache Cargo
      if: steps.cache-ffi.outputs.cache-hit != 'true'
      uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2

    # The WarpBuild runner is arm64, so compiling the x86_64 slice would double
    # the cold FFI work without exercising any additional code in this job.
    - name: Build arm64 FFI for macOS
      if: steps.cache-ffi.outputs.cache-hit != 'true'
      timeout-minutes: 30
      run: ./Scripts/init-local-ffi.sh --arm-macos

    # Verify the cache/build produced an arm64-only binary and a valid XCFramework.
    - name: Verify XCFramework
      env:
        FFI_CACHE_HIT: ${{ steps.cache-ffi.outputs.cache-hit }}
        RUNNER_ARCH: ${{ runner.arch }}
        RUNNER_NAME: ${{ runner.name }}
        RUNNER_OS: ${{ runner.os }}
      run: |
        XCFRAMEWORK="LocalPackages/libzcashlc.xcframework"
        BINARY="$XCFRAMEWORK/macos-arm64_x86_64/libzcashlc.framework/libzcashlc"
        test -d "$XCFRAMEWORK"
        plutil -lint "$XCFRAMEWORK/Info.plist"
        test "$(lipo -archs "$BINARY")" = "arm64"
        {
          echo "### Swift CI runner"
          echo "- Runner: $RUNNER_NAME ($RUNNER_OS/$RUNNER_ARCH)"
          echo "- FFI cache hit: $FFI_CACHE_HIT"
          echo "- FFI architecture: arm64"
        } >> "$GITHUB_STEP_SUMMARY"

    # Set up LocalPackages so Package.swift auto-detects the local build
    - name: Configure local FFI for CI
      run: |
        mkdir -p LocalPackages
        cp BuildSupport/LocalPackages-Package.swift LocalPackages/Package.swift
        echo "LocalPackages created — Package.swift will use local FFI"

    # Build the Swift package
    - name: Build ZcashLightClientKit Swift Package
      timeout-minutes: 15
      run: swift build -v

    # Run tests
    - name: Run OfflineTests suite
      timeout-minutes: 10
      run: swift test --filter OfflineTests
