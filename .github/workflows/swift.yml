name: Build and Run Offline Tests

on:
  pull_request:
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/*'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'responsible_disclosure.md'
      - 'SWIFTLINT.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read

    runs-on: warp-macos-15-arm64-12x

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
      timeout-minutes: 1

    - name: Select Xcode version
      run: sudo xcode-select -s '/Applications/Xcode_16.0.app/Contents/Developer'

    - name: Install pinned Rust verification tools
      run: |
        rust_toolchain=$(sed -nE 's/^channel = "([^"]+)"/\1/p' rust-toolchain.toml)
        rustup toolchain install "$rust_toolchain" --profile minimal
        rustup component add --toolchain "$rust_toolchain" llvm-tools-preview

    # Public SDK CI consumes the reviewed, committed artifact from the exact public Rust graph.
    - name: Verify committed XCFramework
      run: ./Scripts/verify-ironwood-ffi-artifact.sh

    # `swift test` builds the library and test targets in one package-planning pass.
    - name: Build package and run OfflineTests suite
      timeout-minutes: 15
      run: swift test --filter OfflineTests
