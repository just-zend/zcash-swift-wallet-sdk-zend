[package]
name = "old-orchard-fixture-generator"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.1"
publish = false

[dependencies]
prost = "=0.14.4"
rand = "=0.8.5"
rand_chacha = "=0.3.1"
rusqlite = { version = "=0.37.0", features = ["bundled"] }
zcash_client_backend = { version = "=0.23.0", features = ["orchard", "test-dependencies", "transparent-inputs"] }
zcash_client_sqlite = { version = "=0.21.1", features = ["orchard", "serde", "test-dependencies", "transparent-inputs", "unstable"] }
zcash_keys = { version = "=0.14.0", features = ["orchard", "transparent-inputs"] }
zcash_primitives = "=0.28.0"
zcash_protocol = { version = "=0.9.0", features = ["local-consensus"] }
