[package]
name = "libzcashlc"
version = "2.6.0"
authors = [
    "Jack Grigg <thestr4d@gmail.com>",
    "Lukas Korba <lukas@zodl.com>",
    "Kris Nuttycombe<kris@nutty.land>",
    "Francisco Gindre",
]
license = "MIT"
edition = "2024"
rust-version = "1.90"
build = "rust/build.rs"

[dependencies]

# Zcash
orchard = { version = "0.15", features = ["unstable-voting-circuits"] }
pasta_curves = "0.5"
ff = "0.13"
sapling = { package = "sapling-crypto", version = "0.7", default-features = false }
transparent = { package = "zcash_transparent", version = "0.10", default-features = false }
zcash_address = { version = "0.13" }
zcash_client_backend = { version = "0.24.0-rc.1", features = [
    "lightwalletd-tonic-tls-webpki-roots",
    "orchard",
    "pczt",
    "tor",
    "transparent-inputs",
    "unstable",
] }
zcash_client_sqlite = { version = "0.22.0-rc.1", features = ["migration-delivery", "orchard", "transparent-inputs", "unstable", "serde"] }
zcash_note_encryption = "0.4.1"
zcash_primitives = "0.30"
zcash_proofs = "0.30"
zcash_protocol = { version = "0.10", features = ["local-consensus"] }
# Not on crates.io yet — the pool-migration engine lives on librustzcash main (its
# SQLite store moved into `zcash_client_sqlite::pool_migration`, so the old separate
# store crate is gone). Direct git dependency at the same rev as the
# [patch.crates-io] family below so the whole graph stays one family instance.
zcash_pool_migration = { git = "https://github.com/just-zend/librustzcash", rev = "d44099e1ee6701427b00f7b68d82824d4cbbf2b7", features = ["wallet"] }
zcash_script = "0.4"
zip32 = "0.2"
pczt = { version = "0.8.0", features = ["prover"] }
shardtree = "0.7"

# EIP-681
eip681 = "0.1.0"

# Infrastructure
prost = "0.14"
rusqlite = "0.37"
secrecy = "0.8"
rand = "0.8"
nonempty = "0.11"

# FFI
anyhow = "1.0"
ffi_helpers = "0.3"
uuid = "1.1"
bitflags = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"

# HTTP
bytes = "1"
http = "1"
http-body-util = "0.1"

# Initialization
cfg-if = "1.0"
rayon = "1.7"

# lightwalletd
tonic = "0.14"

# Logging
log-panics = "2.0"
once_cell = "1.0"
sharded-slab = "0.1"
tracing = "0.1"
tracing-subscriber = "0.3"

# Tor
fs-mistrust = "0.12"
tor-rtcompat = "0.35"
rust_decimal = { version = "1", default-features = false, features = ["c-repr"] }
# - The "static" feature is required for the "compression" default feature of arti-client.
xz2 = { version = "0.1", features = ["static"] }

# Voting
zcash_voting = "1"
zcash_keys = { version = "0.15.0", features = ["orchard"] }
incrementalmerkletree = { version = "0.8", default-features = false }

[dev-dependencies]
hex = "0.4"

[build-dependencies]
bindgen = "0.72"
cbindgen = "0.29"
cc = "1.0"

[lib]
name = "zcashlc"
path = "rust/src/lib.rs"
crate-type = ["staticlib"]

[profile.release]
lto = true
# Keep the provenance-locked universal simulator archive below Zend's conservative Git-blob safety
# cap without weakening optimization, changing panic semantics, or stripping exported FFI symbols.
# A single codegen unit also gives LTO the most complete view of duplicated generic instantiations;
# the tradeoff is intentionally limited to a slower canonical release build.
codegen-units = 1

# The Ironwood-era librustzcash family is not on crates.io yet; unreleased
# sources ride [patch.crates-io] against the canonical repo — never direct
# git+branch dependencies. The exact Zend rev below contains the reviewed upstream baseline plus
# the additive migration-delivery delta; zcash_voting is independently pinned but resolves its
# librustzcash-family crates through this workspace patch, so the graph has one family instance.
# Bump it deliberately (build + OfflineTests green), and delete the whole block at the 0.24-era
# crates.io release.
[patch.crates-io]
zcash_voting = { git = "https://github.com/just-zend/zcash_voting.git", rev = "04d255628f1d56de0479e3fb6963409dbe44ec1f" }

# Pin the whole librustzcash stack to a single git rev carrying the merged Ironwood
# historical selector, pending a crates.io release. zcash_voting no longer hard-pins
# librustzcash (it declares crates.io versions and patches from its own root), so this
# workspace's patch governs the rev for the entire graph and everything resolves to one
# copy. Bump this rev in one place to advance the stack.
equihash = { git = "https://github.com/just-zend/librustzcash", rev = "d44099e1ee6701427b00f7b68d82824d4cbbf2b7" }
f4jumble = { git = "https://github.com/just-zend/librustzcash", rev = "d44099e1ee6701427b00f7b68d82824d4cbbf2b7" }
pczt = { git = "https://github.com/just-zend/librustzcash", rev = "d44099e1ee6701427b00f7b68d82824d4cbbf2b7" }
zcash_address = { git = "https://github.com/just-zend/librustzcash", rev = "d44099e1ee6701427b00f7b68d82824d4cbbf2b7" }
zcash_client_backend = { git = "https://github.com/just-zend/librustzcash", rev = "d44099e1ee6701427b00f7b68d82824d4cbbf2b7" }
zcash_client_sqlite = { git = "https://github.com/just-zend/librustzcash", rev = "d44099e1ee6701427b00f7b68d82824d4cbbf2b7" }
zcash_encoding = { git = "https://github.com/just-zend/librustzcash", rev = "d44099e1ee6701427b00f7b68d82824d4cbbf2b7" }
zcash_keys = { git = "https://github.com/just-zend/librustzcash", rev = "d44099e1ee6701427b00f7b68d82824d4cbbf2b7" }
zcash_primitives = { git = "https://github.com/just-zend/librustzcash", rev = "d44099e1ee6701427b00f7b68d82824d4cbbf2b7" }
zcash_proofs = { git = "https://github.com/just-zend/librustzcash", rev = "d44099e1ee6701427b00f7b68d82824d4cbbf2b7" }
zcash_protocol = { git = "https://github.com/just-zend/librustzcash", rev = "d44099e1ee6701427b00f7b68d82824d4cbbf2b7" }
zcash_transparent = { git = "https://github.com/just-zend/librustzcash", rev = "d44099e1ee6701427b00f7b68d82824d4cbbf2b7" }
zip321 = { git = "https://github.com/just-zend/librustzcash", rev = "d44099e1ee6701427b00f7b68d82824d4cbbf2b7" }
